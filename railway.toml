# Web (TanStack Start / Nitro) — use this for the public site service.
# Set at build time: VITE_API_URL = your API’s public https URL (no /api suffix).
# Repository root should be the service root in Railway.
[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @gettin-paid/shared build && pnpm --filter @gettin-paid/frontend build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/"
healthcheckTimeout = 30
